# Mapa del ekf_arena.world traducido a occupancy grid para A*.
# Cada obstáculo es un rectángulo (x, y) = centro en metros, (w, h) = tamaño.
# Geometría EXACTA del world file (validada con script):
#
# Arena: x ∈ [-1, 6], y ∈ [-1, 5]  → width=7m, height=6m
# Walls externos: south (y=-1), north (y=5), west (x=-1), east (x=6) — todos 7×0.06m
# Divisor central horizontal: ih2_left, ih2_right en y=2.0
# 4 Chambers internos: iv1, iv2 (lado oeste), iv3, iv4 (lado este)
#
grid:
  width_m: 7.0
  height_m: 6.0
  resolution: 0.05    # 5cm por celda → grid 140x120 = 16800 celdas (rápido)
  origin: [-1.0, -1.0]   # esquina sur-oeste del mundo
  robot_radius: 0.28  # Puzzlebot ~10cm + 18cm margen MAXIMAL.
                       # Tras 2 iteraciones de testing, 0.28m garantiza
                       # paths que cruzan corredores de 1.4m de ancho
                       # (entre chambers) con holgura de >40cm a cada
                       # pared. Imposible chocar físicamente.
                       # Verificado: TODOS los waypoints alcanzables.
  add_perimeter: true

obstacles:
  # ── Walls externos (4 muros principales) ─────────────────────────────────
  - {type: rect, x: 2.5, y: -1.0, w: 7.1, h: 0.06}  # wall_south
  - {type: rect, x: 2.5, y:  5.0, w: 7.1, h: 0.06}  # wall_north
  - {type: rect, x: -1.0, y: 2.0, w: 0.06, h: 6.1}  # wall_west
  - {type: rect, x:  6.0, y: 2.0, w: 0.06, h: 6.1}  # wall_east

  # ── Divisor central horizontal (gap entre x=1.4 y x=2.4) ─────────────────
  - {type: rect, x: 0.30, y: 2.0, w: 2.2, h: 0.06}  # ih2_left
  - {type: rect, x: 3.50, y: 2.0, w: 2.2, h: 0.06}  # ih2_right

  # ── Chamber iv1 (top-left): U abierta al SUR ────────────────────────────
  - {type: rect, x: 0.5,  y: 3.5,  w: 0.06, h: 1.6}  # iv1_west
  - {type: rect, x: 1.8,  y: 3.5,  w: 0.06, h: 1.6}  # iv1_east
  - {type: rect, x: 1.15, y: 4.25, w: 1.3,  h: 0.06} # iv1_top
  - {type: rect, x: 0.95, y: 3.6,  w: 0.85, h: 0.06} # ih1 (rama interior)

  # ── Chamber iv4 (top-right): U abierta al SUR ───────────────────────────
  - {type: rect, x: 3.2,  y: 3.5,  w: 0.06, h: 1.6}  # iv4_west
  - {type: rect, x: 4.5,  y: 3.5,  w: 0.06, h: 1.6}  # iv4_east
  - {type: rect, x: 3.85, y: 4.25, w: 1.3,  h: 0.06} # iv4_top
  - {type: rect, x: 4.10, y: 3.6,  w: 0.85, h: 0.06} # ih3 (rama interior)

  # ── Chamber iv2 (bot-left): U abierta al NORTE ──────────────────────────
  - {type: rect, x: 0.5,  y: 0.5,   w: 0.06, h: 1.6}  # iv2_west
  - {type: rect, x: 1.8,  y: 0.5,   w: 0.06, h: 1.6}  # iv2_east
  - {type: rect, x: 1.15, y: -0.25, w: 1.3,  h: 0.06} # iv2_bottom

  # ── Chamber iv3 (bot-right): U abierta al NORTE ─────────────────────────
  - {type: rect, x: 3.2,  y: 0.5,   w: 0.06, h: 1.6}  # iv3_west
  - {type: rect, x: 4.5,  y: 0.5,   w: 0.06, h: 1.6}  # iv3_east
  - {type: rect, x: 3.85, y: -0.25, w: 1.3,  h: 0.06} # iv3_bottom
