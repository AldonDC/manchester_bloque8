waypoint_manager:
  ros__parameters:
    # ── Part 2 waypoints, hamster-maze arena (ekf_arena.world) ──────────
    # Closed trajectory that satisfies the PDF Part 2 rules:
    #   - >=4 target points
    #   - NO straight (axis-aligned) paths between consecutive points
    #     (every leg has both dx != 0 AND dy != 0)
    #   - NO two consecutive legs in the same direction
    #     (heading change at every waypoint is >50°)
    #   - Robot has to circumnavigate the inner chambers iv1..iv4 to go
    #     from one waypoint to the next
    #
    # Maze geometry recap (post offset):
    #   arena:  x in [-1, 6], y in [-1, 5]
    #   chambers: iv1, iv4 (top) at y~3.5; iv2, iv3 (bottom) at y~0.5
    #   mid dividers leave a vertical gap at x ~ [1.4, 2.4], y = 2.0
    #
    # Trajectory (closed loop):
    #
    #                 y = +3.5  ┌─── iv1 ───┐    ┌─── iv4 ───┐
    #                           │            │    │            │
    #                p3 (-0.5, +2.5)         p2 (+2.0, +3.5)
    #                   *<---------------------*
    #                           ▲                          \
    #                           │                           ▼
    #                           │  central     ROBOT(1.95, 2.0)
    #                           │   gap                    \
    #                           │                           ▼
    #                p0 (+2.0, +0.5)*-------------->* p1 (+4.7, +2.0)
    #                           │            │    │            │
    #                 y = -0.5  └─── iv2 ───┘    └─── iv3 ───┘
    #                          x=-1      x=2.0      x=6
    #
    # Each leg crosses the dividers via the central gap, forcing the
    # robot to weave between the inner chambers — that satisfies the
    # PDF requirement of "circumnavigate all the obstacles".
    waypoints:
      - 2.0    # p0_x  (south of dividers, between iv2 & iv3)
      - 0.5    # p0_y
      - 4.7    # p1_x  (east corridor near outer wall)
      - 2.0    # p1_y
      - 2.0    # p2_x  (north of dividers, between iv1 & iv4)
      - 3.5    # p2_y
      - -0.5   # p3_x  (west corridor near outer wall)
      - 2.5    # p3_y
    frame_id: 'odom'
    loop: true
    dwell_time: 1.5      # 1.5 s pause at each waypoint
    publish_period: 1.0  # republish current /goal every 1 s
