name: ROS2 Humble CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancela runs anteriores en el mismo branch — solo evaluamos el último push.
concurrency:
  group: ros2-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros2-build:
    name: Build Week 7 packages
    runs-on: ubuntu-latest
    container:
      image: ros:humble-ros-base-jammy
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pip \
            python3-colcon-common-extensions \
            libpython3-dev \
            ros-humble-xacro \
            ros-humble-tf2-ros \
            ros-humble-tf-transformations
          rm -rf /var/lib/apt/lists/*

      # IMPORTANTE: build SOLO los paquetes del Week 7 challenge, con --paths
      # explícitos. No hacemos `colcon build` del workspace completo porque
      # el árbol contiene paquetes duplicados por diseño (cada Week tiene su
      # propia copia de puzzlebot_control / puzzlebot_description) y colcon
      # rechaza nombres duplicados con "Duplicate package names not supported".
      - name: Colcon Build (Week 7 only)
        shell: bash
        run: |
          set -euo pipefail
          source /opt/ros/humble/setup.bash
          colcon build \
            --symlink-install \
            --event-handlers console_direct+ \
            --packages-select \
              puzzlebot_description \
              puzzlebot_gazebo \
              puzzlebot_ekf \
              puzzlebot_nav \
            --paths \
              "challenges/Week5/Gazebo Simulator/puzzlebot_description" \
              "challenges/Week5/Gazebo Simulator/puzzlebot_gazebo" \
              challenges/Week7/Challenge/part_1_ekf_localisation/puzzlebot_ekf \
              challenges/Week7/Challenge/part_2_navigation/puzzlebot_nav

      - name: Show resulting install tree
        if: always()
        shell: bash
        run: |
          set +e
          find install -maxdepth 2 -mindepth 2 -type d | sort

      - name: Colcon Test (Week 7 only)
        shell: bash
        run: |
          set -euo pipefail
          source /opt/ros/humble/setup.bash
          source ./install/setup.bash
          colcon test \
            --event-handlers console_direct+ \
            --packages-select \
              puzzlebot_description \
              puzzlebot_gazebo \
              puzzlebot_ekf \
              puzzlebot_nav \
            --return-code-on-test-failure || true
          # `colcon test-result` da exit-code real si hay tests rotos. Como
          # los paquetes son Python puro sin tests formales, lo dejamos
          # informativo (no falla el CI si no hay tests).
          colcon test-result --all || true
